[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cycling-route-trainer"
version = "0.1.0"
description = "Ride GPX routes on an FTMS smart trainer with real terrain physics"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Fuka" }]
dependencies = [
    "bleak>=1.0",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "gpxpy>=1.6",
    "fitdecode>=0.10",
    "fit-tool>=0.9.13",
    "tomli-w>=1.0",
    "PySide6>=6.6",
    "qasync>=0.27",
    "pyqtgraph>=0.13.4",
    "httpx>=0.27",
    "platformdirs>=4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "ruff>=0.5",
]

[project.scripts]
crt-tool = "crt.tools.cli:app"
crt-gui = "crt.gui.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
